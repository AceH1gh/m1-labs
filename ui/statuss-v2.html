<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iesnieguma statuss · Ezermalas novada pašvaldība</title>
  <style>
    :root {
      --navy: #1D3557;
      --teal: #2A9D8F;
      --coral: #E76F51;
      --bg: #F1F3F5;
      --line: #C9CED6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #1a1a1a;
    }
    header { background: var(--navy); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.85; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input {
      width: 100%; padding: 8px; margin-top: 4px; font: inherit;
      border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    .hint { font-size: 0.85rem; color: #555; margin-top: 4px; }
    button {
      margin-top: 16px; padding: 10px 20px; font: inherit; font-weight: 600;
      color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .message { padding: 12px; border-radius: 6px; margin-top: 16px; }
    .message.error { background: #fdece7; border: 1px solid var(--coral); }
    .message.ok { background: #e6f4f2; border: 1px solid var(--teal); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 8px 0 0; }
    dt { font-weight: 600; }
    dd { margin: 0; }
    .deadline { display: block; margin-top: 2px; }
    /* Prasme: nokavēts termiņš sarkanā krāsā. #E76F51 izskatās oranžs un ir par blāvu. */
    .overdue { color: #C62828; font-weight: 700; }
    @media (max-width: 400px) {
      header h1 { font-size: 1.05rem; }
      dl { grid-template-columns: 1fr; gap: 2px; }
      dd { margin-bottom: 8px; }
    }
    footer { font-size: 0.8rem; color: #555; text-align: center; padding: 16px; }
    a { color: var(--navy); }
  </style>
</head>
<body>
  <header>
    <h1>Ezermalas novada pašvaldība · Iesnieguma statuss</h1>
    <p>Mācību prototips. Pašvaldība ir izdomāta. Visi dati ir sintētiski.</p>
  </header>

  <main>
    <form id="status-form" class="card" novalidate>
      <label for="submissionId">Iesnieguma numurs</label>
      <input id="submissionId" name="submissionId" autocomplete="off" placeholder="IES-2026-000123">
      <div class="hint">Numuru saņēmāt, kad iesniedzāt iesniegumu.</div>

      <button type="submit" id="submit">Pārbaudīt statusu</button>
      <div id="message" aria-live="polite"></div>
    </form>
  </main>

  <footer>
    <a href="/ui/">Iesniegt iesniegumu</a> · Ezermalas pieteikumu sistēma · mācību prototips
  </footer>

  <script>
    const STATUS_TEXT = {
      RECEIVED: "Saņemts",
      IN_PROGRESS: "Izskatīšanā",
      FORWARDED: "Pārsūtīts",
      ANSWERED: "Atbildēts",
      WITHDRAWN: "Atsaukts",
    };
    // Šiem statusiem termiņš vairs nav aktuāls.
    const CLOSED = ["ANSWERED", "WITHDRAWN"];
    const LOAD_ERROR = "Neizdevās ielādēt datus. Mēģiniet vēlreiz.";

    const form = document.getElementById("status-form");
    const input = document.getElementById("submissionId");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submit");

    function formatDate(isoDate) {
      const [year, month, day] = isoDate.split("-");
      return `${day}.${month}.${year}`;
    }

    function daysLeft(isoDate) {
      const [year, month, day] = isoDate.split("-").map(Number);
      const now = new Date();
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((Date.UTC(year, month - 1, day) - today) / 86400000);
    }

    function daysText(n) {
      return n % 10 === 1 && n % 100 !== 11 ? `Atlikusi ${n} diena` : `Atlikušas ${n} dienas`;
    }

    function showError(text) {
      message.className = "message error";
      message.textContent = text;
    }

    function showStatus(data) {
      message.className = "message ok";
      message.replaceChildren();
      const dl = document.createElement("dl");
      const rows = [
        ["Numurs", data.id],
        ["Statuss", STATUS_TEXT[data.status] || data.status],
        ["Atbildes termiņš", formatDate(data.dueDate)],
      ];
      for (const [label, value] of rows) {
        const dt = document.createElement("dt");
        const dd = document.createElement("dd");
        dt.textContent = label;
        dd.textContent = value;
        dl.append(dt, dd);
      }
      if (!CLOSED.includes(data.status)) {
        const days = daysLeft(data.dueDate);
        const note = document.createElement("span");
        note.className = days < 0 ? "deadline overdue" : "deadline";
        note.textContent = days < 0 ? "Termiņš nokavēts" : daysText(days);
        dl.lastChild.append(note);
      }
      message.append(dl);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = input.value.trim();
      if (!id) {
        showError("Ievadiet iesnieguma numuru.");
        return;
      }
      submitButton.disabled = true;
      message.className = "";
      message.textContent = "";
      try {
        const response = await fetch(`/submissions/${encodeURIComponent(id)}`);
        if (response.status === 404) {
          showError("Iesniegums ar šādu numuru nav atrasts. Pārbaudiet numuru.");
        } else if (!response.ok) {
          showError(LOAD_ERROR);
        } else {
          // Rādām tikai numuru, statusu un termiņu, bez personas datiem.
          showStatus(await response.json());
        }
      } catch (error) {
        showError(LOAD_ERROR);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
